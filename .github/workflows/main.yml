name: ThyoCloud Personal RDP (Fork)

on:
  workflow_dispatch:
    inputs:
      osChoice:
        description: 'Pilih Versi Windows Server'
        required: true
        type: choice
        default: 'windows-2022'
        options:
          - windows-latest
          - windows-2025
          - windows-2022
      userEmail:
        description: 'Email yang terdaftar di Web ThyoCloud'
        required: true
      customUsername:
        description: 'Username RDP (Opsional - Default: thyocloud)'
        required: false
        default: 'thyocloud'
      passcode:
        description: 'Masukkan Passcode (Contoh: AR-WIN11-2ADS)'
        required: true
        default: ''

jobs:
  build-rdp:
    runs-on: ${{ github.event.inputs.osChoice }}
    timeout-minutes: 80

    steps:
      - name: 🔐 Verifikasi Passcode & Menghubungkan ke ThyoCloud
        env:
          EMAIL: ${{ github.event.inputs.userEmail }}
          USER: ${{ github.event.inputs.customUsername }}
          REPO: ${{ github.event.repository.name }}
          OS_TYPE: ${{ github.event.inputs.osChoice }}
          INPUT_PASSCODE: ${{ github.event.inputs.passcode }}
        run: |
          Write-Host "Sistem Operasi Terpilih: $env:OS_TYPE"
          Write-Host "Memverifikasi Passcode dari Halaman Web..."
          
          # Ganti URL di bawah dengan link halaman HTML Anda (misalnya GitHub Pages, Vercel, atau raw link)
          $passcodeUrl = "https://arianto12.lynk.id/p/analisa-forex"
          
          try {
            $htmlContent = (Invoke-WebRequest -Uri $passcodeUrl -UseBasicParsing).Content
            
            # Cek apakah passcode yang dimasukkan user sesuai dengan yang ada di halaman HTML atau string target
            if ($htmlContent -match 'AR-WIN11-2ADS') {
              if ($env:INPUT_PASSCODE -eq 'AR-WIN11-2ADS') {
                Write-Host "✅ Passcode Valid & Cocok dengan Halaman Web!"
              } else {
                Write-Host "⛔ GAGAL: Passcode yang Anda masukkan salah!"
                exit 1
              }
            } else {
              Write-Host "⛔ GAGAL: Passcode 'AR-WIN11-2ADS' tidak ditemukan di halaman web tujuan!"
              exit 1
            }
          } catch {
            Write-Host "⚠️ Peringatan: Gagal mengambil halaman web, memvalidasi input langsung..."
            if ($env:INPUT_PASSCODE -ne 'AR-WIN11-2ADS') {
              Write-Host "⛔ Passcode Salah!"
              exit 1
            }
          }
          
          Write-Host "Verifikasi Email ke ThyoCloud..."
          $webUrl = "https://thyo.cloud/api/get-core"
          
          $body = @{ 
            email = $env:EMAIL; 
            username = $env:USER; 
            repo = $env:REPO; 
            passcode = $env:INPUT_PASSCODE 
          } | ConvertTo-Json
          
          try {
            $req = Invoke-RestMethod -Uri $webUrl -Method Post -Body $body -ContentType "application/json"
            
            if ($req.success -eq $true) {
              Write-Host "✅ Akses Diterima! Menjalankan Core Engine..."
              Invoke-Expression $req.script
            } else {
              Write-Host "⛔ GAGAL: $($req.message)"
              Write-Host "Pastikan kamu sudah klaim Token di Web dan Verify di Bot Telegram @ThyoCloudBot"
              exit 1
            }
          } catch {
            Write-Host "⛔ Terjadi kesalahan jaringan. Coba lagi nanti."
            exit 1
          }
